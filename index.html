<!DOCTYPE html>
<html lang="en" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Eyebuckz | Filmmaking Academy</title>
    <meta name="description" content="Learn filmmaking from industry experts. Professional courses on cinematography, editing, direction and more at Eyebuckz Academy." />
    <meta name="google" content="notranslate" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Eyebuckz | Filmmaking Academy" />
    <meta property="og:description" content="Learn filmmaking from industry experts. Professional courses on cinematography, editing, direction and more." />
    <meta property="og:url" content="https://eyebuckz.com" />
    <meta property="og:image" content="https://eyebuckz.com/og-image.png" />
    <meta property="og:site_name" content="Eyebuckz" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Eyebuckz | Filmmaking Academy" />
    <meta name="twitter:description" content="Learn filmmaking from industry experts. Professional courses on cinematography, editing, direction and more." />
    <meta name="twitter:image" content="https://eyebuckz.com/og-image.png" />

    <!-- Favicon & PWA -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Theme color — matches browser chrome to page theme -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f1f4f8" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="image" href="/premium_banner_1.webp" fetchpriority="high" type="image/webp">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@700;800;900&family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+Malayalam:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
  <body>
    <div id="root"></div>
    <!-- Apply theme before React renders to prevent flash of wrong theme -->
    <style>html{visibility:hidden}</style>
    <script>
      (function() {
        var theme = localStorage.getItem('theme');
        if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
        document.documentElement.style.visibility = 'visible';
      })();
    </script>
    <script type="module" src="/index.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js');
        });
      }
    </script>
  </body>
</html>
